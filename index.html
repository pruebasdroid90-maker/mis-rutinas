<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mis Rutinas</title>
<meta name="description" content="Rutinas y tareas del día para ir tachando, con temporizador y registro de progreso.">
<meta name="theme-color" content="#F3F4F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D111D" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rutinas">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: una columna tipo agenda; a la izquierda un raíl de horas (timeline) y a la derecha tarjetas del color de su grupo */
:root{
  --bg:#F3F4F8; --surface:#FFFFFF; --sunk:#E8EBF2; --ink:#141A2B; --muted:#5D6580; --line:#D9DEE9;
  --accent:#2D47DB; --accent-ink:#FFFFFF; --accent-soft:#E2E7FC;
  --postit:#FFE47A; --postit-ink:#3B3100; --ok:#16845A; --ok-soft:#DDF3E8; --warn:#C2410C; --warn-soft:#FDEBDF; --sleep:#C8CFE0;
  --r0:#3B57E8; --r1:#E4572E; --r2:#12936E; --r3:#B83C98; --r4:#F2C033; --r5:#7B54DC; --r6:#1597BE; --r7:#4A5468;
  --i0:#FFFFFF; --i1:#FFFFFF; --i2:#FFFFFF; --i3:#FFFFFF; --i4:#2B2100; --i5:#FFFFFF; --i6:#FFFFFF; --i7:#FFFFFF;
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --radius:14px;
  --sat:env(safe-area-inset-top, 0px); --sab:env(safe-area-inset-bottom, 0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0D111D; --surface:#161B2B; --sunk:#1F2539; --ink:#E7EBF6; --muted:#97A0BB; --line:#2A3250;
    --accent:#8197FF; --accent-ink:#0D111D; --accent-soft:#222B52;
    --postit:#E6CC55; --postit-ink:#2A2300; --ok:#45C489; --ok-soft:#173326; --warn:#FB923C; --warn-soft:#3A2214; --sleep:#2C3450;
    --r0:#4F6BFF; --r1:#E8653C; --r2:#1AA37C; --r3:#C24AA3; --r4:#E9BC3A; --r5:#8A66EA; --r6:#1EA5CC; --r7:#5A6580;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-top:calc(8px + var(--sat));padding-bottom:calc(190px + var(--sab));-webkit-tap-highlight-color:transparent;min-height:100vh}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-0.01em}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.num{font-variant-numeric:tabular-nums}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.prog{font-size:13px;color:var(--muted);white-space:nowrap}

.dayhead{display:flex;align-items:center;gap:8px;padding-top:8px}
.dayhead .when{flex:1;min-width:0}
.dayhead h1{font-size:23px;font-weight:750;line-height:1.1}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);flex:none}
.iconbtn svg{width:18px;height:18px}
.pill{font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.btn{padding:11px 16px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:650}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.btn.danger{background:var(--warn);color:#fff}
.btn[disabled]{opacity:.6}
.linkbtn{font-size:13px;font-weight:600;color:var(--accent);padding:8px 2px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.banner{font-size:12.5px;color:var(--muted);background:var(--sunk);border-radius:10px;padding:8px 10px}
.empty{text-align:center;padding:24px 18px;background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty h2{font-size:21px}
.empty p{margin:0;color:var(--muted);max-width:36ch}
.loading{padding:40px 0;text-align:center;color:var(--muted)}

/* Acceso */
.auth{max-width:400px;margin:6vh auto 0;display:flex;flex-direction:column;gap:16px}
.auth .brand{display:flex;align-items:center;gap:12px}
.auth .brand img{width:52px;height:52px;border-radius:14px}
.auth h1{font-size:32px;font-weight:800}
.auth form{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{font-size:13.5px;border-radius:10px;padding:9px 11px;background:var(--warn-soft)}
.msg.ok{background:var(--ok-soft)}

/* Presupuesto del día */
.budget{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:9px 12px;display:flex;flex-direction:column;gap:6px}
.budget-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.budget-top b{font-family:var(--f-display);font-size:16px;font-weight:700}
.bar24{position:relative;height:9px;border-radius:5px;background:var(--sunk);overflow:hidden;display:flex}
.bar24 .seg{height:100%}
.bar24 .sleep{background:repeating-linear-gradient(135deg,var(--sleep) 0 4px,transparent 4px 8px)}
.bar24 .plan{background:var(--accent)}
.bar24 .done{background:var(--ok)}
.bar24 .over{background:var(--warn)}
.legend{display:flex;gap:2px 12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}
.alert{border-radius:10px;padding:9px 11px;font-size:13.5px;background:var(--warn-soft);display:flex;gap:8px;align-items:flex-start}
.alert svg{flex:none;width:16px;height:16px;color:var(--warn);margin-top:2px}

/* Post-it */
.postits{display:flex;flex-direction:column;gap:8px}
.postit{background:var(--postit);color:var(--postit-ink);padding:9px 11px;border-radius:2px 2px 10px 2px;box-shadow:0 1px 0 rgba(0,0,0,.08),0 6px 14px -8px rgba(0,0,0,.35);transform:rotate(-0.6deg);display:flex;gap:10px;align-items:flex-start}
.postit:nth-child(2n){transform:rotate(0.5deg)}
.postit p{margin:0;flex:1;min-width:0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14.5px}
.postit small{display:block;font-size:11px;opacity:.75;margin-top:3px;letter-spacing:.03em}
.postit .for{font-weight:700}
.postit button{font-size:12px;font-weight:600;opacity:.75;padding:2px 4px;color:inherit}
.postit.mini{margin:-2px 10px 0 18px;padding:7px 10px;border-radius:0 0 10px 2px}
.postit.mini p{font-size:13.5px}

/* Timeline */
.tl{list-style:none;margin:0;padding:0;position:relative;display:flex;flex-direction:column;gap:6px}
.tl::before{content:"";position:absolute;left:47px;top:10px;bottom:10px;width:2px;background:var(--line);border-radius:1px}
.tl-row{display:grid;grid-template-columns:40px 16px minmax(0,1fr);align-items:start}
.tl-time{font-family:var(--f-mono);font-size:11.5px;font-weight:700;text-align:right;padding-top:7px;line-height:1.15;font-variant-numeric:tabular-nums}
.tl-time small{display:block;font-weight:500;color:var(--muted);font-size:10px;margin-top:1px}
.tl-node{width:12px;height:12px;border-radius:50%;background:var(--rc);margin:13px auto 0;box-shadow:0 0 0 3px var(--bg);position:relative;z-index:1}
.tl-row.untimed .tl-node{background:var(--bg);border:2px solid var(--rc);width:10px;height:10px;margin-top:14px}
.tl-row.done .tl-node{background:var(--bg);border:2px solid color-mix(in srgb, var(--rc) 50%, transparent)}
.tl-row.done .tl-time{color:var(--muted)}
.tl-stack{display:flex;flex-direction:column;gap:4px;min-width:0}
.tl-sep{display:grid;grid-template-columns:40px 16px minmax(0,1fr);align-items:center;margin-top:6px}
.tl-sep .tl-node{margin:0 auto;width:8px;height:8px;background:var(--muted)}
.tl-sep span:last-child{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.tl-now{display:grid;grid-template-columns:40px 16px minmax(0,1fr);align-items:center;margin-block:-2px}
.tl-now .tl-time{padding:0;color:var(--accent)}
.tl-now .tl-node{margin:0 auto;background:var(--accent);width:10px;height:10px}
.tl-now hr{border:0;height:2px;background:var(--accent);margin:0;border-radius:1px;opacity:.6}

/* Tarjeta */
.tcard{background:var(--rc);color:var(--ri);border:2px solid var(--rc);border-radius:11px;padding:4px 5px 4px 7px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:0 8px;align-items:center;min-height:38px;transition:background .25s ease, color .25s ease, border-color .25s ease}
.tcard .check{width:22px;height:22px;border-radius:50%;border:2px solid currentColor;display:grid;place-items:center;flex:none}
.tcard .check svg{width:12px;height:12px;opacity:0;transition:opacity .2s}
.tcard .body{min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;column-gap:8px;row-gap:0;padding:2px 0}
.tcard .name{font-weight:650;font-size:15px;line-height:1.3;overflow-wrap:anywhere;text-align:left;flex:1 1 7em;min-width:0}
.strike{background-image:linear-gradient(currentColor,currentColor);background-repeat:no-repeat;background-position:0 55%;background-size:0% 2px;transition:background-size .35s ease}
.tcard .meta{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:0 8px;font-size:12px;align-items:center;opacity:.92;margin-left:auto;flex:0 1 auto;line-height:1.4}
.tcard .meta svg{width:12px;height:12px;vertical-align:-1px}
.tcard .chip{font-weight:700;font-size:11px;padding:0 5px;border-radius:5px;background:color-mix(in srgb, currentColor 18%, transparent)}
.tcard .spent{font-weight:700;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px;font-size:12px}
.tcard .spent-edit{display:inline-flex;gap:6px;align-items:center}
.tcard .spent-edit input{width:58px;padding:2px 6px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.tcard .spent-edit button{font-weight:700;text-decoration:underline}
.tcard .play{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb, currentColor 20%, transparent);flex:none}
.tcard .play svg{width:11px;height:11px}
.tcard .grp{font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.85;white-space:nowrap}
.tcard.done{background:transparent;color:var(--muted);border-color:color-mix(in srgb, var(--rc) 45%, transparent)}
.tcard.done .check{background:var(--rc);border-color:var(--rc);color:var(--ri)}
.tcard.done .check svg{opacity:1}
.tcard.done .strike{background-size:100% 2px}
.tcard.done .grp{color:var(--rc);opacity:1}
.tcard.done .chip{background:var(--sunk)}
.tcard.done .play{background:var(--sunk)}
.tcard.running{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--rc)}
.tcard.running .play{background:var(--ri);color:var(--rc)}

.tl-row[data-drag] .tcard{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.tl-row.dragging{position:relative;z-index:30}
.tl-row.dragging .tcard{box-shadow:0 14px 30px -10px rgba(0,0,0,.45);transform:scale(1.02)}
body.drag-active{-webkit-user-select:none;user-select:none;cursor:grabbing}
.tl-group{display:grid;grid-template-columns:40px 16px minmax(0,1fr);align-items:center;margin-top:2px}
.tl-group .tl-node{margin:0 auto;width:14px;height:14px;border-radius:4px}
.gbtn{display:flex;align-items:center;gap:8px;width:100%;padding:5px 10px 5px 6px;border-radius:9px;background:color-mix(in srgb, var(--rc) 13%, transparent);color:var(--ink);text-align:left}
.gbtn svg{width:14px;height:14px;color:var(--rc);flex:none;transition:transform .2s}
.gbtn[aria-expanded="false"] svg{transform:rotate(-90deg)}
.gbtn .gname{flex:1;min-width:0;font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;font-weight:800;color:var(--rc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gbtn .gcount{font-family:var(--f-mono);font-weight:700;font-size:12.5px;font-variant-numeric:tabular-nums}
.gbtn .gbar{width:46px;height:5px;border-radius:3px;background:color-mix(in srgb, var(--rc) 22%, transparent);overflow:hidden;flex:none}
.gbtn .gbar i{display:block;height:100%;background:var(--rc);border-radius:3px}
.gbtn.complete .gcount{color:var(--ok)}
.tl-sep .sepline{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.tl-sep .sepline b{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.tl-sep .sepline button{font-size:12px;font-weight:650;color:var(--accent);padding:4px 0}
#toast{position:fixed;z-index:35;left:max(16px, env(safe-area-inset-left, 0px));right:92px;bottom:calc(64px + var(--sab) + 24px);max-width:440px;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 12px 10px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 26px -10px rgba(0,0,0,.5);font-size:14px}
#toast span{flex:1;min-width:0}
#toast button{font-weight:750;color:var(--accent);padding:6px 4px;filter:brightness(1.35)}
body.running #toast{bottom:calc(64px + var(--sab) + 98px)}
.carry{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--accent-soft);border-radius:10px;padding:6px 10px;font-size:13.5px}

/* Botón + */
.fab{position:fixed;z-index:22;right:max(18px, calc(env(safe-area-inset-right, 0px) + 18px));bottom:calc(64px + var(--sab) + 18px);width:58px;height:58px;border-radius:18px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 10px 24px -8px color-mix(in srgb, var(--accent) 70%, transparent),0 2px 6px rgba(0,0,0,.15);transition:bottom .2s ease}
.fab svg{width:26px;height:26px}
body.running .fab{bottom:calc(64px + var(--sab) + 92px)}

/* Barra del cronómetro */
#runbar{position:fixed;left:0;right:0;bottom:calc(64px + var(--sab));z-index:20;
  padding-left:max(12px, env(safe-area-inset-left, 0px));padding-right:max(12px, env(safe-area-inset-right, 0px));padding-bottom:8px;pointer-events:none}
.runbox{max-width:560px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:18px;padding:10px 10px 10px 14px;display:flex;align-items:center;gap:12px;pointer-events:auto;box-shadow:0 12px 30px -12px rgba(0,0,0,.5)}
.runbox .rinfo{flex:1;min-width:0}
.runbox .rname{font-size:12.5px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.runbox .rclock{font-family:var(--f-mono);font-weight:700;font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.runbox.over .rclock{color:var(--warn)}
.runbox.over{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px color-mix(in srgb, var(--warn) 35%, transparent)}}
.runbox button{height:44px;padding:0 14px;border-radius:12px;font-weight:650;background:color-mix(in srgb, var(--bg) 16%, transparent);color:var(--bg)}
.runbox button.go{background:var(--ok);color:#06150e}
.ring{width:44px;height:44px;flex:none}

/* Pestañas */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-top:1px solid var(--line);
  padding-left:max(8px, env(safe-area-inset-left, 0px));padding-right:max(8px, env(safe-area-inset-right, 0px));padding-top:6px;padding-bottom:calc(6px + var(--sab))}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--muted);height:52px;justify-content:center}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent)}

/* Rutinas */
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.ghead{background:var(--rc);color:var(--ri);padding:12px 14px;display:flex;align-items:center;gap:10px}
.ghead h2{flex:1;min-width:0;font-size:19px}
.ghead button{font-size:13px;font-weight:650;padding:6px 10px;border-radius:8px;background:color-mix(in srgb, currentColor 18%, transparent)}
.gbody{padding:4px 14px 6px}
.gr{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.gr:first-child{border-top:0}
.gr .sw{width:6px;align-self:stretch;border-radius:3px;background:var(--rc);flex:none}
.gr .rmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.gr .rmain b{font-size:15.5px;font-weight:600;overflow-wrap:anywhere}
.gr .rmeta{display:flex;flex-wrap:wrap;gap:3px 10px;font-size:12.5px;color:var(--muted);align-items:center}
.gr .rmeta svg{width:12px;height:12px;vertical-align:-1px}
.gr svg.chev{width:16px;height:16px;color:var(--muted);flex:none}
.gfoot{display:flex;justify-content:space-between;align-items:center;padding:2px 14px 6px;border-top:1px dashed var(--line)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:8px}
.card-head{display:flex;align-items:center;gap:10px}
.card-head h2{font-size:19px;font-weight:700;flex:1;min-width:0}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--rc)}
.archived .arow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.archived .arow:first-child{border-top:0}
.archived .arow span{flex:1;min-width:0}
.settings{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
.field input,.field select,.field textarea{padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:16px;min-width:0;width:100%}
.field textarea{min-height:80px;resize:vertical}

/* Hojas emergentes */
#sheet{position:fixed;inset:0;z-index:40;background:rgba(8,10,20,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:600px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;border-top:6px solid var(--rc, var(--accent));
  padding:16px max(16px, env(safe-area-inset-right, 0px)) calc(20px + var(--sab)) max(16px, env(safe-area-inset-left, 0px));display:flex;flex-direction:column;gap:14px}
.sheet h2{font-size:22px}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches button{width:34px;height:34px;border-radius:50%;background:var(--rc);border:3px solid transparent;box-shadow:inset 0 0 0 2px var(--surface)}
.swatches button[aria-pressed="true"]{border-color:var(--ink)}
.daypick{display:flex;gap:6px;flex-wrap:wrap}
.daypick button{width:38px;height:38px;border-radius:10px;background:var(--sunk);font-weight:700;color:var(--muted)}
.daypick button[aria-pressed="true"]{background:var(--rc);color:var(--ri)}
.toggle{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink)}
.toggle input{width:20px;height:20px;accent-color:var(--accent)}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:40px;height:40px;border-radius:10px;background:var(--sunk);font-size:20px;font-weight:700}
.stepper b{font-family:var(--f-display);font-size:24px;min-width:2ch;text-align:center;color:var(--ink)}
.sheet-actions{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--sunk);border-radius:10px;padding:3px;align-self:flex-start}
.seg button{padding:7px 14px;border-radius:8px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.gchips{display:flex;gap:6px;flex-wrap:wrap}
.gchips button{padding:6px 12px;border-radius:999px;font-size:13.5px;font-weight:650;background:var(--rc);color:var(--ri);border:2px solid transparent;opacity:.55}
.gchips button[aria-pressed="true"]{opacity:1;border-color:var(--ink)}

/* Progreso */
.period{display:flex;align-items:center;justify-content:space-between;gap:8px}
.period b{font-family:var(--f-display);font-size:17px;text-align:center;flex:1}
.summary{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.bigpct{font-family:var(--f-display);font-size:56px;font-weight:800;line-height:.9;letter-spacing:-0.03em}
.bigpct small{font-size:24px;font-weight:700}
.kv{display:flex;flex-direction:column;gap:4px;font-size:13.5px;color:var(--muted)}
.kv b{color:var(--ink);font-weight:650}
.chartwrap svg{display:block;width:100%;height:auto}
.minibar{height:5px;border-radius:3px;background:var(--sunk);overflow:hidden}
.minibar>span{display:block;height:100%;background:var(--rc, var(--accent));border-radius:3px;transition:width .35s ease}
.gstat{padding:12px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.gstat:first-of-type{border-top:0;padding-top:4px}
.gstat-head{display:flex;align-items:center;gap:8px}
.gstat-head b{flex:1;min-width:0;font-family:var(--f-display);font-size:17px}
.gstat-head .pct{font-family:var(--f-display);font-weight:750;font-size:20px}
.rline{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:6px 0 6px 14px;border-left:3px solid var(--rc);margin-left:4px}
.rline b{font-size:14.5px;font-weight:600;overflow-wrap:anywhere}
.rline .pct{font-family:var(--f-mono);font-size:13px;font-weight:700;text-align:right}
.rline .sub{grid-column:1 / -1;font-size:12.5px;color:var(--muted);display:flex;gap:2px 12px;flex-wrap:wrap}
.rline .minibar{grid-column:1 / -1}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<body>
<div class="app" id="view"><p class="loading">Cargando tus rutinas…</p></div>
<div id="runbar" hidden></div>
<button class="fab" id="fab" data-act="fab" aria-label="Añadir tarea o nota" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
<nav class="tabs" id="tabs" aria-label="Secciones" hidden><div class="in">
  <button data-act="tab" data-tab="hoy" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="16" rx="3"/><path d="M8 3v4M16 3v4M8.5 14l2.5 2.5L16 11"/></svg>Hoy</button>
  <button data-act="tab" data-tab="rutinas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.3"/><circle cx="4.5" cy="12" r="1.3"/><circle cx="4.5" cy="18" r="1.3"/></svg>Rutinas</button>
  <button data-act="tab" data-tab="progreso"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V12M10 20V6M15 20v-9M20 20V9"/></svg>Progreso</button>
</div></nav>
<div id="sheet" hidden></div>
<div id="toast" role="status" hidden></div>

<script src="config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s,n) => { const d = parseYmd(s); d.setDate(d.getDate()+n); return ymd(d); };
const today = () => ymd(new Date());
const uid = () => Math.random().toString(36).slice(2,9);
const clone = o => JSON.parse(JSON.stringify(o ?? null));
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const DOW = ['D','L','M','X','J','V','S'];
const DOW_ORDER = [1,2,3,4,5,6,0];
const ALL_DAYS = [0,1,2,3,4,5,6];
const NCOL = 8, TASK_COLOR = 7;
const fmtMin = m => { m = Math.max(0, Math.round(m)); const h = Math.floor(m/60), r = m%60; return h ? (r ? `${h} h ${r} min` : `${h} h`) : `${r} min`; };
const fmtClock = sec => { sec = Math.max(0, Math.floor(sec)); const h = Math.floor(sec/3600), m = Math.floor(sec%3600/60), s = sec%60; return h ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`; };
const toMin = t => { if (!t) return null; const [h,m] = t.split(':').map(Number); return isNaN(h) ? null : h*60 + (m||0); };
const fromMin = m => { m = ((Math.round(m) % 1440) + 1440) % 1440; return `${pad(Math.floor(m/60))}:${pad(m%60)}`; };
const dateLabel = (s, opts={weekday:'long', day:'numeric', month:'long'}) => parseYmd(s).toLocaleDateString('es-ES', opts);
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
const lsSet = (k,v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const weekStart = date => { const d = parseYmd(date); d.setDate(d.getDate() - ((d.getDay()+6)%7)); return ymd(d); };
const rc = c => { const i = ((+c||0) % NCOL + NCOL) % NCOL; return `--rc:var(--r${i});--ri:var(--i${i})`; };

const ICON = {
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.8v14.4a1 1 0 0 0 1.5.86l11.2-7.2a1 1 0 0 0 0-1.72L8.5 3.94A1 1 0 0 0 7 4.8z"/></svg>',
  pause:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4.5" width="4.2" height="15" rx="1.2"/><rect x="13.8" y="4.5" width="4.2" height="15" rx="1.2"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  left:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  right:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
  chev:'<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
  bell:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 21h4"/></svg>',
  warn:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9.5 17h-19z"/><path d="M12 10v4.5M12 17.5v.1"/></svg>',
};

const APP_VERSION = '1.3';
/* ---------- estado ---------- */
// mode: loading | setup | login | local | cloud
const S = { groups:{}, routines:{}, notes:{}, settings:{ wake:'07:30', sleepHours:8 }, days:{}, mode:'loading', got:{}, err:'', user:null };
const UI = { tab:'hoy', date: today(), range:'week', offset:0, editSpent:null, sheet:null, draft:null, confirmDel:false, showArchived:false, confirmPurge:null, authMsg:null, authBusy:false };
let RUN = lsGet('rutinas-run');
let FS = null, BASE = '', UNSUB = [];

const byOrder = (a,b) => (a.order ?? 0) - (b.order ?? 0) || String(a.createdAt).localeCompare(String(b.createdAt));
const groupList = (withEnded=false) => Object.values(S.groups).filter(g => withEnded || !g.endedAt).sort(byOrder);
const allRoutines = () => Object.values(S.routines).sort(byOrder);
const routinesOf = (gid, withEnded=false) => allRoutines().filter(r => r.groupId === gid && (withEnded || !r.endedAt));
const activeOn = (r, date) => (!r.createdAt || r.createdAt <= date) && (!r.endedAt || date < r.endedAt);
const weekday = date => parseYmd(date).getDay();
const isWeekly = r => r.freq?.type === 'week';
const scheduledOn = (r, date) => activeOn(r, date) && (isWeekly(r) || (r.freq?.days || ALL_DAYS).includes(weekday(date)));
const doneOn = (rid, date) => !!S.days[date]?.items?.[rid]?.done;
function weekCount(rid, date, exceptDate){
  const ws = weekStart(date); let n = 0;
  for (let i = 0; i < 7; i++){ const d = addDays(ws, i); if (d !== exceptDate && doneOn(rid, d)) n++; }
  return n;
}
function weeklyState(r, date){
  const n = Math.max(1, +r.freq.n || 1), doneToday = doneOn(r.id, date);
  const count = weekCount(r.id, date), before = weekCount(r.id, date, date);
  const daysLeft = 7 - ((parseYmd(date).getDay()+6)%7);
  return { n, count, doneToday, met: before >= n, mustToday: !doneToday && before < n && (n - before) >= daysLeft };
}
const freqLabel = r => isWeekly(r) ? `${r.freq.n} ${+r.freq.n === 1 ? 'vez' : 'veces'} por semana` : ((r.freq?.days || ALL_DAYS).length === 7 ? 'Todos los días' : DOW_ORDER.filter(d => (r.freq?.days || ALL_DAYS).includes(d)).map(d => DOW[d]).join(' · '));
const dayDoc = date => clone(S.days[date] || { date, items:{}, tasks:[] });
const awakeMin = () => (24 - Math.min(16, Math.max(4, +S.settings.sleepHours || 8))) * 60;
const groupOf = r => S.groups[r?.groupId] || null;
const wakeMin = () => toMin(S.settings.wake || '07:30') ?? 450;
const dayPos = t => { let m = toMin(t); if (m === null) return null; if (m < wakeMin()) m += 1440; return m; };

/* Rutinas visibles un día: las que tocan + las ya hechas ese día; las semanales con el objetivo cumplido se ocultan */
function dayRoutines(date){
  return allRoutines().filter(r => {
    if (doneOn(r.id, date)) return true;
    if (!scheduledOn(r, date)) return false;
    if (isWeekly(r) && weeklyState(r, date).met) return false;
    return true;
  });
}

/* ---------- guardado (Firebase o local) ---------- */
function write(path, data){
  if (S.mode === 'cloud' && FS){
    const ref = FS.doc(BASE + path);
    (data === null ? ref.delete() : ref.set(clone(data))).catch(e => {
      S.err = e && e.code === 'permission-denied' ? 'Firebase ha rechazado el guardado: revisa las reglas de Firestore (paso 3 de la guía).' : 'No se pudo guardar el último cambio. Se reintentará cuando haya conexión.';
      render();
    });
  } else saveLocal();
}
function saveLocal(){ lsSet('rutinas-local', { groups:S.groups, routines:S.routines, notes:S.notes, settings:S.settings, days:S.days }); }
function loadLocal(){ const d = lsGet('rutinas-local'); if (d){ S.groups = d.groups||{}; S.routines = d.routines||{}; S.notes = d.notes||{}; S.settings = d.settings||S.settings; S.days = d.days||{}; } }
const strip = o => { const { id, _new, _key, ...body } = o; return body; };
function saveDay(date, doc){ doc.date = date; S.days[date] = doc; write('days/' + date, doc); }
function saveGroup(g){ const body = strip(g); S.groups[g.id] = { id:g.id, ...body }; write('groups/' + g.id, body); }
function saveRoutine(r){ const body = strip(r); S.routines[r.id] = { id:r.id, ...body }; write('routines/' + r.id, body); }
function saveNote(n){ const body = strip(n); S.notes[n.id] = { id:n.id, ...body }; write('notes/' + n.id, body); }
function deleteNote(id){ delete S.notes[id]; write('notes/' + id, null); }
function removeRoutineDoc(id){ delete S.routines[id]; write('routines/' + id, null); }
function saveSettings(){ write('config/settings', { ...S.settings }); }
const hasHistory = rid => Object.values(S.days).some(d => d.items?.[rid] && (d.items[rid].done || d.items[rid].spentSec));
function endRoutine(r){
  // Nunca se borra del todo aquí: pasa a «Rutinas eliminadas» y se puede recuperar.
  const nr = clone(S.routines[r.id]); nr.endedAt = today(); saveRoutine(nr);
}

/* ---------- deshacer ---------- */
let TOAST = null;
function showUndo(text, undo){
  if (TOAST) clearTimeout(TOAST.t);
  TOAST = { text, undo, t: setTimeout(() => { TOAST = null; renderToast(); }, 8000) };
  renderToast();
}
function renderToast(){
  const el = $('#toast');
  if (!TOAST || !inApp()){ el.hidden = true; el.innerHTML = ''; return; }
  el.hidden = false;
  el.innerHTML = `<span>${esc(TOAST.text)}</span><button data-act="undo">Deshacer</button>`;
}

/* ---------- cálculos ---------- */
function budget(date){
  const awake = awakeMin(), doc = S.days[date] || {};
  let total = 0, pend = 0, doneMin = 0, flex = 0;
  const sched = [];
  for (const r of dayRoutines(date)){
    const m = +r.minutes || 0, done = doneOn(r.id, date);
    if (isWeekly(r) && !done){ const w = weeklyState(r, date); if (!w.mustToday){ flex += m; continue; } }
    total += m; if (done) doneMin += m; else pend += m;
    if (r.time) sched.push({ name:r.name, start:dayPos(r.time), min:m });
  }
  for (const t of (doc.tasks||[])){
    const m = +t.minutes || 0; total += m; if (t.done) doneMin += m; else pend += m;
    if (t.time) sched.push({ name:t.text, start:dayPos(t.time), min:m });
  }
  const wake = wakeMin(), bed = wake + awake, issues = [];
  const norm = sched.map(s => ({ ...s, e: s.start + s.min })).sort((a,b) => a.start - b.start);
  for (const s of norm) if (s.e > bed) issues.push(`«${s.name}» termina a las ${fromMin(s.e)}, dentro de tus ${+S.settings.sleepHours||8} h de sueño (te acuestas a las ${fromMin(bed)}).`);
  for (let i = 1; i < norm.length; i++) if (norm[i].start < norm[i-1].e) issues.push(`«${norm[i-1].name}» y «${norm[i].name}» se solapan a las ${fromMin(norm[i].start)}.`);
  let left = null;
  if (date === today()){ const n = new Date(); let now = n.getHours()*60 + n.getMinutes(); if (now < wake) now += 1440; left = Math.max(0, bed - now); }
  return { awake, total, pend, doneMin, flex, issues, left, wake, bed };
}
function getSpent(date, key){
  const d = S.days[date]; if (!d) return 0;
  if (key.startsWith('t:')) return (d.tasks||[]).find(t => 't:'+t.id === key)?.spentSec || 0;
  return d.items?.[key]?.spentSec || 0;
}
function setEntry(date, key, fn){
  const doc = dayDoc(date); doc.items ||= {}; doc.tasks ||= [];
  if (key.startsWith('t:')){ const t = doc.tasks.find(t => 't:'+t.id === key); if (!t) return; fn(t); }
  else { const e = doc.items[key] || { done:false, spentSec:0 }; fn(e); doc.items[key] = e; }
  saveDay(date, doc);
}
function streak(r){
  const t = today();
  if (isWeekly(r)){
    let n = 0, ws = weekStart(t);
    for (let k = 0; k < 120; k++, ws = addDays(ws, -7)){
      if (r.createdAt && addDays(ws, 6) < r.createdAt) break;
      if (weekCount(r.id, ws) >= (+r.freq.n || 1)) n++; else if (k === 0) continue; else break;
    }
    return { n, unit: n === 1 ? 'semana' : 'semanas' };
  }
  let n = 0, d = t;
  for (let k = 0; k < 400; k++, d = addDays(d,-1)){
    if (r.createdAt && d < r.createdAt) break;
    if (!scheduledOn(r, d)) continue;
    if (doneOn(r.id, d)) n++; else if (d === t) continue; else break;
  }
  return { n, unit: n === 1 ? 'día' : 'días' };
}
function periodRange(){
  const t = parseYmd(today());
  if (UI.range === 'week'){
    const mon = parseYmd(addDays(weekStart(today()), UI.offset*7)), sun = new Date(mon); sun.setDate(mon.getDate()+6);
    const label = `${mon.getDate()} ${mon.toLocaleDateString('es-ES',{month:'short'})} – ${sun.getDate()} ${sun.toLocaleDateString('es-ES',{month:'short'})}`;
    return { from: ymd(mon), to: ymd(sun), label: UI.offset === 0 ? 'Esta semana' : UI.offset === -1 ? 'Semana pasada' : label, sub: label };
  }
  const first = new Date(t.getFullYear(), t.getMonth() + UI.offset, 1), last = new Date(first.getFullYear(), first.getMonth()+1, 0);
  return { from: ymd(first), to: ymd(last), label: cap(first.toLocaleDateString('es-ES',{month:'long', year:'numeric'})), sub:'' };
}
function routineStats(r, from, to){
  const t = today(), end = to < t ? to : t;
  let planned = 0, done = 0, spent = 0, times = 0;
  if (isWeekly(r)){
    const n = +r.freq.n || 1;
    for (let ws = weekStart(from); ws <= to && ws <= t; ws = addDays(ws, 7)){
      let overlap = 0, cnt = 0;
      for (let i = 0; i < 7; i++){ const d = addDays(ws, i); if (d < from || d > to) continue; if (activeOn(r, d)) overlap++; if (d <= t && doneOn(r.id, d)) cnt++; }
      if (!overlap && !cnt) continue;
      const target = Math.round(n * overlap / 7);
      planned += target; done += Math.min(cnt, target);
    }
  }
  for (let d = from; d <= end; d = addDays(d, 1)){
    const dn = doneOn(r.id, d);
    if (!isWeekly(r)){ if (scheduledOn(r, d) || dn) planned++; if (dn) done++; }
    if (dn) times++;
    spent += S.days[d]?.items?.[r.id]?.spentSec || 0;
  }
  return { planned, done, spent, times, minutesDone: times * (+r.minutes||0), minutesPlanned: planned * (+r.minutes||0) };
}
function statsFor(from, to){
  const t = today(), daily = [], groups = [];
  let planned = 0, done = 0, spent = 0, tTot = 0, tDone = 0;
  for (const g of groupList(true)){
    const rs = routinesOf(g.id, true).map(r => ({ r, st: routineStats(r, from, to) })).filter(x => x.st.planned || x.st.times || x.st.spent);
    if (!rs.length) continue;
    const gs = rs.reduce((a, x) => ({ planned: a.planned + x.st.planned, done: a.done + x.st.done, spent: a.spent + x.st.spent, minutesDone: a.minutesDone + x.st.minutesDone }), { planned:0, done:0, spent:0, minutesDone:0 });
    groups.push({ g, rs, ...gs });
    planned += gs.planned; done += gs.done; spent += gs.spent;
  }
  for (let d = from; d <= to; d = addDays(d,1)){
    if (d > t){ daily.push({ d, pct:null }); continue; }
    let dp = 0, dd = 0;
    for (const r of allRoutines()){ const dn = doneOn(r.id, d); if ((scheduledOn(r, d) && !isWeekly(r)) || dn) dp++; if (dn) dd++; }
    for (const tk of (S.days[d]?.tasks || [])){ tTot++; if (tk.done) tDone++; spent += tk.spentSec || 0; }
    daily.push({ d, pct: dp ? dd/dp : null, dp, dd });
  }
  return { groups, daily, planned, done, spent, tTot, tDone };
}

/* ---------- cronómetro ---------- */
let actx = null, wakeLock = null;
function unlockAudio(){ try { actx ||= new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch {} }
async function notify(text){
  try {
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    const reg = await navigator.serviceWorker?.getRegistration();
    if (reg) reg.showNotification('Mis Rutinas', { body: text, icon: 'icon-192.png', tag: 'timer', renotify: true, vibrate: [400,200,400] });
    else new Notification('Mis Rutinas', { body: text });
  } catch {}
}
function alarm(text){
  try {
    if (actx){
      const t0 = actx.currentTime + 0.05;
      for (let k = 0; k < 4; k++) for (let j = 0; j < 3; j++){
        const o = actx.createOscillator(), g = actx.createGain();
        o.type = 'triangle'; o.frequency.value = [784, 988, 1319][j];
        const s = t0 + k*1.0 + j*0.16;
        g.gain.setValueAtTime(0.0001, s); g.gain.exponentialRampToValueAtTime(0.4, s+0.02); g.gain.exponentialRampToValueAtTime(0.0001, s+0.22);
        o.connect(g).connect(actx.destination); o.start(s); o.stop(s+0.25);
      }
    }
  } catch {}
  try { navigator.vibrate && navigator.vibrate([400,200,400,200,400]); } catch {}
  notify(text);
}
async function keepAwake(on){
  try {
    if (on && !wakeLock && navigator.wakeLock){ wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener?.('release', () => { wakeLock = null; }); }
    if (!on && wakeLock){ await wakeLock.release(); wakeLock = null; }
  } catch { wakeLock = null; }
}
const elapsed = () => RUN ? RUN.base + (Date.now() - RUN.startedAt)/1000 : 0;
function startRun(date, key, name, targetSec){
  unlockAudio();
  if (targetSec && 'Notification' in window && Notification.permission === 'default'){ try { Notification.requestPermission(); } catch {} }
  if (RUN) stopRun(false);
  const base = getSpent(date, key);
  RUN = { date, key, name, startedAt: Date.now(), base, target: targetSec || null, alarmed: targetSec ? base >= targetSec : true };
  lsSet('rutinas-run', RUN); keepAwake(true); render();
}
function stopRun(markDone){
  if (!RUN) return;
  const sec = Math.round(elapsed()); const { date, key } = RUN;
  RUN = null; lsSet('rutinas-run', null); keepAwake(false);
  setEntry(date, key, e => { e.spentSec = sec; if (markDone){ e.done = true; e.doneAt = Date.now(); } });
  render();
}
function clockText(){
  const el = elapsed();
  if (!RUN.target) return { txt: fmtClock(el), over:false, frac:null };
  const rem = RUN.target - el;
  return rem >= 0 ? { txt: fmtClock(rem), over:false, frac: el / RUN.target } : { txt: '+' + fmtClock(-rem), over:true, frac:1 };
}
function tick(){
  if (!RUN) return;
  const c = clockText();
  const clk = $('#rclock'); if (clk) clk.textContent = c.txt;
  const box = $('.runbox'); if (box) box.classList.toggle('over', c.over);
  const ring = $('#ringfg'); if (ring && c.frac !== null) ring.setAttribute('stroke-dasharray', `${(Math.min(1,c.frac)*113.1).toFixed(1)} 200`);
  document.querySelectorAll('[data-live]').forEach(n => { if (n.dataset.live === RUN.date + '|' + RUN.key) n.textContent = 'en marcha · ' + fmtClock(elapsed()); });
  if (RUN.target && !RUN.alarmed && elapsed() >= RUN.target){
    RUN.alarmed = true; lsSet('rutinas-run', RUN); alarm('Tiempo cumplido: ' + RUN.name);
    const lbl = $('#rlabel'); if (lbl) lbl.textContent = '¡Tiempo! ' + RUN.name;
  }
}

async function authAction(kind){

function dayEntries(date){
  const doc = S.days[date] || { items:{}, tasks:[] };
  const out = [];
  for (const r of dayRoutines(date)){
    const st = doc.items?.[r.id] || {}, g = groupOf(r);
    let extra = '';
    if (isWeekly(r)){
      const w = weeklyState(r, date);
      extra = `<span class="chip">${w.count}/${w.n} sem.</span>` + (w.mustToday ? `<span class="chip">toca hoy</span>` : '');
    }
    out.push({ key:r.id, kind:'r', name:r.name, minutes:+r.minutes||0, time:r.time||'', timer:!!r.timer, done:!!st.done, doneAt:st.doneAt||0, spent:st.spentSec||0, color: g ? g.color : TASK_COLOR, label: g ? g.name : '', gid: r.groupId || '', extra, order: +r.order||0, rid:r.id });
  }
  (doc.tasks||[]).forEach((t, i) => {
    const g = t.groupId ? S.groups[t.groupId] : null;
    out.push({ key:'t:'+t.id, kind:'t', name:t.text, minutes:+t.minutes||0, time:t.time||'', timer: !!(+t.minutes) && t.timer !== false, done:!!t.done, doneAt:t.doneAt||0, spent:t.spentSec||0, color: g ? g.color : TASK_COLOR, label: g ? g.name : 'Tarea', gid: g ? t.groupId : '', extra:'', order: t.order != null ? +t.order : 10000 + i });
  });
  const timed = out.filter(e => e.time).sort((a,b) => dayPos(a.time) - dayPos(b.time) || a.order - b.order);
  const open = out.filter(e => !e.time && !e.done).sort((a,b) => a.order - b.order);
  const closed = out.filter(e => !e.time && e.done).sort((a,b) => a.doneAt - b.doneAt);
  return { timed, open, closed };
}

  if (S.mode === 'local') h += `<div class="banner">Modo prueba: los datos se guardan solo en este dispositivo. <button class="linkbtn" data-act="leaveLocal" style="padding:0">Conectar mi cuenta</button></div>`;

function renderHoy(){

      <span class="seg" style="flex:1"></span>${overPct ? `<span class="seg over" style="width:${overPct}%"></span>` : ''}<span class="seg sleep" style="width:${sleepPct - overPct}%"></span>
    </div>
    <div class="legend"><span><i style="background:var(--ok)"></i>Hecho ${fmtMin(b.doneMin)}</span><span><i style="background:var(--accent)"></i>Pendiente ${fmtMin(b.pend)}</span><span><i style="background:var(--sleep)"></i>Sueño ${+S.settings.sleepHours||8} h</span>${b.flex ? `<span>Flexibles ${fmtMin(b.flex)}</span>` : ''}</div>`;
  if (over > 0) h += `<div class="alert">${ICON.warn}<div>Lo planificado ocupa <b>${fmtMin(over)} más</b> de lo que tienes despierto. Quita algo o muévelo a otro día para respetar tus ${+S.settings.sleepHours||8} h de sueño.</div></div>`;

  for (const i of b.issues) h += `<div class="alert">${ICON.warn}<div>${esc(i)}</div></div>`;
  h += `</section>`;

  const visNotes = Object.values(S.notes).filter(n => n.from <= date).sort((a,b) => String(a.from).localeCompare(b.from));
  const topNotes = visNotes.filter(n => !n.rid);
  if (topNotes.length) h += `<div class="postits">${topNotes.map(n => noteHtml(n, false)).join('')}</div>`;

  if (isToday){
    for (let k = 1; k <= 7; k++){
      const pd = addDays(t, -k), left = (S.days[pd]?.tasks || []).filter(x => !x.done && !x.carried);
      if (left.length){ h += `<div class="carry"><span>${left.length} ${left.length === 1 ? 'tarea pendiente' : 'tareas pendientes'} del ${esc(dateLabel(pd,{weekday:'long', day:'numeric'}))}</span><button class="linkbtn" data-act="carry" data-from="${pd}">Traer a hoy</button></div>`; break; }
    }
  }

  const { timed, open, closed } = dayEntries(date);
  if (!timed.length && !open.length && !closed.length){
    h += groupList().length
      ? `<section class="empty"><h2>Día libre</h2><p>Hoy no te toca ninguna rutina. Pulsa + para apuntar una tarea.</p></section>`

    return h;
  }
  const notesFor = rid => visNotes.filter(n => n.rid === rid);
  const row = (e, timedRow, scope) => {
    const running = RUN && RUN.date === date && RUN.key === e.key;
    const end = e.time && e.minutes ? fromMin(toMin(e.time) + e.minutes) : '';
    return `<li class="tl-row ${timedRow ? '' : 'untimed'} ${e.done ? 'done' : ''}" style="${rc(e.color)}"${scope != null ? ` data-drag="1" data-key="${esc(e.key)}" data-scope="${esc(scope)}"` : ''}>
      <div class="tl-time">${timedRow ? `${esc(e.time)}${end ? `<small>${end}</small>` : ''}` : ''}</div><span class="tl-node"></span>
      <div class="tl-stack">${cardHtml(e, running, date)}${e.rid ? notesFor(e.rid).map(n => noteHtml(n, true)).join('') : ''}</div></li>`;
  };
  const nowPos = (() => { const n = new Date(); let m = n.getHours()*60 + n.getMinutes(); if (m < wakeMin()) m += 1440; return m; })();
  const nowRow = () => `<li class="tl-now" aria-label="Ahora"><span class="tl-time">${fromMin(nowPos)}</span><span class="tl-node"></span><hr></li>`;
  let nowPlaced = !isToday || !timed.length;
  h += `<ol class="tl" aria-label="Agenda del día">`;
  for (const e of timed){
    if (!nowPlaced && dayPos(e.time) > nowPos){ h += nowRow(); nowPlaced = true; }
    h += row(e, true);
  }
  if (!nowPlaced) h += nowRow();
  if (open.length){
    const grouped = S.settings.groupUntimed !== false;
    h += `<li class="tl-sep"><span></span><span class="tl-node"></span><div class="sepline"><b>${timed.length ? 'Sin hora' : 'Para hoy'}</b><button data-act="toggleGroupUntimed">${grouped ? 'Ver todo junto' : 'Agrupar por grupo'}</button></div></li>`;
    if (grouped){
      const all = [...timed, ...open, ...closed], collapsed = S.settings.collapsed || {};
      for (const c of clusterize([...open, ...closed])){
        const g = c.gid ? S.groups[c.gid] : null, ck = c.gid || '_';
        const mine = all.filter(e => (e.gid && S.groups[e.gid] ? e.gid : '') === c.gid);
        const nd = mine.filter(e => e.done).length, nt = mine.length, isOpen = !collapsed[ck];
        h += `<li class="tl-group" style="${rc(g ? g.color : TASK_COLOR)}"><span></span><span class="tl-node"></span><button class="gbtn ${nd === nt ? 'complete' : ''}" data-act="toggleCluster" data-ck="${esc(ck)}" aria-expanded="${isOpen}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg><span class="gname">${esc(g ? g.name : 'Tareas')}</span><span class="gcount">${nd}/${nt}</span><span class="gbar"><i style="width:${nt ? nd/nt*100 : 0}%"></i></span></button></li>`;
        if (!isOpen) continue;
        for (const e of c.items) h += row({ ...e, hideLabel:true }, false, e.done ? null : ck);

  if (closed.length && !(open.length && S.settings.groupUntimed !== false)){
    if (open.length || timed.length) h += `<li class="tl-sep"><span></span><span class="tl-node"></span><span>Hechas</span></li>`;
    for (const e of closed) h += row(e, false);
  }
  return h + `</ol>`;
}
/* Agrupa las tareas sin hora por grupo, en el orden de los grupos; las tareas sueltas al final */
function clusterize(items){
  const by = new Map();
  for (const e of items){ const k = e.gid && S.groups[e.gid] ? e.gid : ''; if (!by.has(k)) by.set(k, []); by.get(k).push(e); }
  const order = groupList(true).map(g => g.id).filter(id => by.has(id));
  if (by.has('')) order.push('');
  return order.map(gid => ({ gid, items: by.get(gid).sort((a,b) => (a.done - b.done) || (a.done ? a.doneAt - b.doneAt : a.order - b.order)) }));
}
function noteHtml(n, mini){

  return `<div class="postit ${mini ? 'mini' : ''}"><div style="flex:1;min-width:0"><p>${forTxt}${esc(n.text)}</p><small>Nota del ${esc(dateLabel(n.from,{day:'numeric', month:'short'}))}</small></div><button data-act="delNote" data-nid="${n.id}">Quitar</button></div>`;

/* ---------- vista Progreso ---------- */
function chartSvg(daily){
  const n = daily.length, W = 340, H = 150, L = 34, B = 22, T = 8;
  const cw = (W - L - 4) / n, bw = Math.max(3, cw * (n > 10 ? 0.62 : 0.5));
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Cumplimiento por día">`;
  for (const g of [0, .5, 1]){
    const y = T + (H - T - B) * (1 - g);
    s += `<line x1="${L}" x2="${W-2}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1" ${g===0?'':'stroke-dasharray="3 4"'}/>`;
    s += `<text x="${L-6}" y="${y+4}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="var(--f-mono)">${g*100}%</text>`;
  }
  const t = today();
  daily.forEach((d, i) => {
    const cx = L + cw*i + cw/2, base = H - B;
    if (d.pct !== null){
      const hh = Math.max(2, (H - T - B) * Math.min(1, d.pct));
      s += `<rect x="${(cx-bw/2).toFixed(1)}" y="${(base-hh).toFixed(1)}" width="${bw.toFixed(1)}" height="${hh.toFixed(1)}" rx="${Math.min(3,bw/2).toFixed(1)}" fill="${d.pct >= 1 ? 'var(--ok)' : 'var(--accent)'}"><title>${dateLabel(d.d,{day:'numeric',month:'short'})}: ${Math.round(d.pct*100)}% (${d.dd}/${d.dp})</title></rect>`;
    } else s += `<circle cx="${cx.toFixed(1)}" cy="${base-3}" r="1.6" fill="var(--muted)" opacity=".5"/>`;
    const dt = parseYmd(d.d), show = n <= 10 || dt.getDate() === 1 || dt.getDate() % 5 === 0;
    if (show) s += `<text x="${cx.toFixed(1)}" y="${H-7}" text-anchor="middle" font-size="10" font-weight="${d.d===t?700:400}" fill="${d.d===t ? 'var(--ink)' : 'var(--muted)'}" font-family="var(--f-mono)">${n <= 10 ? DOW[dt.getDay()] : dt.getDate()}</text>`;
  });
  return s + `</svg>`;
}
function renderProgreso(){
  const p = periodRange(), st = statsFor(p.from, p.to);
  const pct = st.planned ? Math.round(st.done / st.planned * 100) : 0;
  let h = `<div class="dayhead"><div class="when"><div class="eyebrow">Registro</div><h1>Progreso</h1></div>
    <div class="seg" role="group" aria-label="Periodo"><button data-act="range" data-range="week" aria-pressed="${UI.range==='week'}">Semana</button><button data-act="range" data-range="month" aria-pressed="${UI.range==='month'}">Mes</button></div></div>
  <div class="period"><button class="iconbtn" data-act="prevPeriod" aria-label="Periodo anterior">${ICON.left}</button><b>${esc(p.label)}${p.sub && UI.offset >= -1 ? `<span class="prog" style="display:block;font-family:var(--f-body);font-weight:500;font-size:12.5px">${esc(p.sub)}</span>` : ''}</b><button class="iconbtn" data-act="nextPeriod" aria-label="Periodo siguiente" ${UI.offset >= 0 ? 'disabled style="opacity:.35"' : ''}>${ICON.right}</button></div>`;
  h += `<section class="card"><div class="summary"><div class="bigpct num">${pct}<small>%</small></div>
    <div class="kv"><span><b class="num">${st.done} de ${st.planned}</b> veces cumplidas</span><span>Tiempo cronometrado: <b class="num">${fmtMin(st.spent/60)}</b></span><span>Tareas del día: <b class="num">${st.tDone} de ${st.tTot}</b></span></div></div>
    <div class="chartwrap">${chartSvg(st.daily)}</div>
    <p class="hint">Hasta hoy. Las rutinas de «X veces por semana» cuentan contra su objetivo semanal.</p></section>`;
  if (st.groups.length){
    h += `<section class="card"><div class="card-head"><h2>Por grupo y rutina</h2></div>`;
    for (const G of st.groups){
      const gp = G.planned ? Math.round(G.done / G.planned * 100) : 0;
      h += `<div class="gstat" style="${rc(G.g.color)}"><div class="gstat-head"><span class="dot"></span><b>${esc(G.g.name)}</b><span class="pct num">${gp}%</span></div>
        <div class="minibar"><span style="width:${gp}%"></span></div>
        <div class="hint num">${G.done}/${G.planned} veces · ${fmtMin(G.minutesDone)} dedicados${G.spent >= 30 ? ` · ${fmtMin(G.spent/60)} cronometrados` : ''}</div>`;
      for (const { r, st: rs } of G.rs){
        const rp = rs.planned ? Math.round(rs.done / rs.planned * 100) : (rs.times ? 100 : 0);
        const sk = r.endedAt ? null : streak(r);
        h += `<div class="rline"><b>${esc(r.name)}${r.endedAt ? ' <span class="prog">(eliminada)</span>' : ''}</b><span class="pct">${rp}%</span>
          <div class="minibar"><span style="width:${Math.min(100,rp)}%"></span></div>
          <div class="sub num"><span>${rs.times}/${rs.planned} ${isWeekly(r) ? `(${r.freq.n}/semana)` : 'veces'}</span><span>${fmtMin(rs.minutesDone)} de ${fmtMin(rs.minutesPlanned)}</span>${rs.spent >= 30 ? `<span>${fmtMin(rs.spent/60)} cronometrados</span>` : ''}${sk && sk.n > 1 ? `<span>Racha: ${sk.n} ${sk.unit}</span>` : ''}</div></div>`;
      }
      h += `</div>`;
    }
    h += `</section>`;
  } else h += `<section class="empty"><p>Cuando tengas rutinas activas en este periodo verás aquí cuánto las has cumplido.</p></section>`;
  return h;
}

/* ---------- ordenar arrastrando ---------- */
let DRAG = null, suppressClickUntil = 0, pressTimer = null, pressInfo = null;
function nextOrder(date){
  const { timed, open, closed } = dayEntries(date);
  return Math.max(0, ...[...timed, ...open, ...closed].map(e => +e.order || 0)) + 1;
}
function clearPress(){ clearTimeout(pressTimer); pressTimer = null; pressInfo = null; }
document.addEventListener('pointerdown', e => {
  if (DRAG || e.button > 0) return;
  const li = e.target.closest('li[data-drag]');
  if (!li || e.target.closest('.check, .play, .spent, .spent-edit, input, select, textarea')) return;
  pressInfo = { li, x: e.clientX, y: e.clientY, id: e.pointerId };
  pressTimer = setTimeout(() => { if (pressInfo) beginDrag(pressInfo.li, pressInfo.y); }, e.pointerType === 'mouse' ? 180 : 380);
});
function beginDrag(li, y){
  const ol = li.parentNode, r = li.getBoundingClientRect();
  DRAG = { li, ol, scope: li.dataset.scope, grab: y - r.top, y };
  pressTimer = null;
  li.classList.add('dragging'); document.body.classList.add('drag-active');
  try { navigator.vibrate && navigator.vibrate(12); } catch {}
}
function dragMove(y){
  const { li, ol, scope } = DRAG; DRAG.y = y;
  const olTop = ol.getBoundingClientRect().top;
  const top = y - olTop - DRAG.grab, h = li.offsetHeight;
  const rows = [...ol.querySelectorAll(`li[data-drag][data-scope="${CSS.escape(scope)}"]`)];
  const idx = rows.indexOf(li);
  for (let i = 0; i < idx; i++){ const r = rows[i]; if (top < r.offsetTop + r.offsetHeight / 2){ ol.insertBefore(li, r); break; } }
  const rows2 = [...ol.querySelectorAll(`li[data-drag][data-scope="${CSS.escape(scope)}"]`)], idx2 = rows2.indexOf(li);
  for (let i = rows2.length - 1; i > idx2; i--){ const r = rows2[i]; if (top + h > r.offsetTop + r.offsetHeight / 2){ r.after(li); break; } }
  li.style.transform = `translateY(${top - li.offsetTop}px)`;
  if (y < 90) window.scrollBy(0, -10); else if (y > innerHeight - 170) window.scrollBy(0, 10);
}
document.addEventListener('pointermove', e => {
  if (DRAG){ e.preventDefault(); dragMove(e.clientY); return; }
  if (pressInfo && Math.hypot(e.clientX - pressInfo.x, e.clientY - pressInfo.y) > 8) clearPress();
}, { passive:false });
document.addEventListener('touchmove', e => { if (DRAG) e.preventDefault(); }, { passive:false });
document.addEventListener('contextmenu', e => { if (DRAG || pressInfo) e.preventDefault(); });
function endDrag(){
  if (!DRAG){ clearPress(); return; }
  const { li, ol, scope } = DRAG;
  const keys = [...ol.querySelectorAll(`li[data-drag][data-scope="${CSS.escape(scope)}"]`)].map(r => r.dataset.key);
  li.classList.remove('dragging'); li.style.transform = ''; document.body.classList.remove('drag-active');
  DRAG = null; clearPress(); suppressClickUntil = Date.now() + 300;
  applyOrder(keys); render();
}
document.addEventListener('pointerup', endDrag);
document.addEventListener('pointercancel', endDrag);
function applyOrder(keys){
  const date = UI.date, { open } = dayEntries(date), cur = new Map(open.map(e => [e.key, +e.order || 0]));
  const vals = keys.map(k => cur.get(k) ?? 0).sort((a,b) => a - b);
  for (let i = 1; i < vals.length; i++) if (vals[i] <= vals[i-1]) vals[i] = vals[i-1] + 0.001;
  const doc = dayDoc(date); doc.tasks ||= []; doc.items ||= {}; let tasksChanged = false;
  keys.forEach((k, i) => {
    const v = Math.round(vals[i] * 1000) / 1000;
    if (cur.get(k) === v) return;
    if (k.startsWith('t:')){ const t = doc.tasks.find(t => 't:'+t.id === k); if (t){ t.order = v; tasksChanged = true; } }
    else if (S.routines[k]){ const r = clone(S.routines[k]); r.order = v; saveRoutine(r); }
  });
  if (tasksChanged) saveDay(date, doc);
}

/* ---------- acciones ---------- */
document.addEventListener('click', e => {
  if (Date.now() < suppressClickUntil){ e.preventDefault(); e.stopPropagation(); return; }
  const b = e.target.closest('[data-act]');
  if (!b){ if (e.target.id === 'sheet') closeSheet(); return; }
  e.preventDefault();
  act(b.dataset.act, b);
});
function act(a, b){
  const key = b.dataset.key;
  switch (a){
    case 'signup': authAction('up'); break;
    case 'resetPass': authAction('reset'); break;
    case 'signout': stopListening(); firebase.auth().signOut(); break;
    case 'tryLocal': lsSet('rutinas-try-local', true); startLocal(); break;
    case 'leaveLocal': lsSet('rutinas-try-local', false); location.reload(); break;
    case 'tab': UI.tab = b.dataset.tab; UI.editSpent = null; UI.confirmPurge = null; render(); window.scrollTo(0,0); break;
    case 'prevDay': UI.date = addDays(UI.date,-1); UI.editSpent = null; render(); break;
    case 'nextDay': UI.date = addDays(UI.date, 1); UI.editSpent = null; render(); break;
    case 'goToday': UI.date = today(); render(); break;
    case 'fab': openTask(null); break;
    case 'sheetKind': { const txt = UI.draft?.text || ''; if (b.dataset.k === 'note') openNote(); else openTask(null); UI.draft.text = txt; renderSheet(); break; }
    case 'toggle': {
      const wasDone = b.getAttribute('aria-pressed') === 'true';
      if (RUN && RUN.date === UI.date && RUN.key === key && !wasDone){ stopRun(true); break; }
      setEntry(UI.date, key, x => { x.done = !x.done; x.doneAt = x.done ? Date.now() : null; });
      render(); break;
    }
    case 'run': {
      if (RUN && RUN.date === UI.date && RUN.key === key){ stopRun(false); break; }
      let name = '', target = null;
      if (key.startsWith('t:')){ const t = (S.days[UI.date]?.tasks || []).find(t => 't:'+t.id === key); if (!t) break; name = t.text; target = +t.minutes && t.timer !== false ? t.minutes*60 : null; }
      else { const r = S.routines[key]; if (!r) break; name = (groupOf(r)?.name ? groupOf(r).name + ' · ' : '') + r.name; target = r.timer && +r.minutes ? r.minutes*60 : null; }
      startRun(UI.date, key, name, target); break;
    }
    case 'runPause': stopRun(false); break;
    case 'runDone': stopRun(true); break;
    case 'openItem': if (key.startsWith('t:')) openTask(key); else openRoutine(key); break;
    case 'editSpent': UI.editSpent = key; render(); setTimeout(() => { const n = $('#spent-input'); if (n){ n.focus(); n.select(); } }, 30); break;
    case 'saveSpent': { const v = Math.max(0, +($('#spent-input')?.value) || 0); UI.editSpent = null; setEntry(UI.date, key, x => { x.spentSec = Math.round(v*60); }); render(); break; }
    case 'carry': {
      const from = b.dataset.from, src = dayDoc(from), dst = dayDoc(today()); dst.tasks ||= []; dst.items ||= {};
      let o = nextOrder(today());
      for (const t of (src.tasks||[])) if (!t.done && !t.carried){ t.carried = true; dst.tasks.push({ id: uid(), text: t.text, minutes: t.minutes||0, time: t.time||'', timer: t.timer !== false, groupId: t.groupId||'', done:false, spentSec:0, order: o++ }); }
      saveDay(from, src); saveDay(today(), dst); render(); break;
    }
    case 'delNote': { const n = clone(S.notes[b.dataset.nid]); deleteNote(b.dataset.nid); render(); if (n) showUndo('Nota quitada', () => saveNote(n)); break; }
    case 'undo': if (TOAST){ const u = TOAST.undo; clearTimeout(TOAST.t); TOAST = null; renderToast(); u(); render(); } break;
    case 'toggleCluster': { const ck = b.dataset.ck, c = { ...(S.settings.collapsed || {}) }; if (c[ck]) delete c[ck]; else c[ck] = true; S.settings.collapsed = c; saveSettings(); render(); break; }
    case 'toggleGroupUntimed': S.settings.groupUntimed = S.settings.groupUntimed === false; saveSettings(); render(); break;
    case 'purge': {
      const rid = b.dataset.rid;
      if (UI.confirmPurge !== rid){ UI.confirmPurge = rid; render(); break; }
      UI.confirmPurge = null; removeRoutineDoc(rid);
      for (const n of Object.values(S.notes)) if (n.rid === rid) deleteNote(n.id);
      render(); break;
    }
    case 'newGroup': openGroup(null); break;
    case 'editGroup': openGroup(b.dataset.gid); break;
    case 'newRoutine': openRoutine(null, b.dataset.gid); break;
    case 'editRoutine': openRoutine(b.dataset.rid); break;
    case 'closeSheet': closeSheet(); break;
    case 'color': UI.draft.color = +b.dataset.c; renderSheet(); break;
    case 'pickGroup': UI.draft.groupId = b.dataset.gid; renderSheet(); break;
    case 'noteWhen': UI.draft.when = b.dataset.w; renderSheet(); break;
    case 'freqType': {
      const f = UI.draft.freq;
      UI.draft.freq = b.dataset.t === 'week' ? { type:'week', n: f.n || 3 } : { type:'days', days: f.days || ALL_DAYS.slice() };
      renderSheet(); break;
    }
    case 'freqN': UI.draft.freq.n = Math.min(7, Math.max(1, (+UI.draft.freq.n || 1) + +b.dataset.d)); renderSheet(); break;
    case 'dayToggle': { const d = +b.dataset.d, ds = UI.draft.freq.days; UI.draft.freq.days = ds.includes(d) ? ds.filter(x => x !== d) : [...ds, d]; renderSheet(); break; }
    case 'saveGroup': {
      if (UI.confirmDel){ UI.confirmDel = false; renderSheet(); break; }
      const d = UI.draft; d.name = (d.name||'').trim();
      if (!d.name){ const n = $('#ed-name'); n.focus(); n.placeholder = 'Ponle un nombre'; break; }
      const isNew = d._new; saveGroup(d); closeSheet(); render();
      if (isNew) openRoutine(null, d.id);
      break;
    }
    case 'delGroup': {
      if (!UI.confirmDel){ UI.confirmDel = true; renderSheet(); break; }
      const g = S.groups[UI.draft.id], prevG = clone(g), prevR = routinesOf(g.id).map(clone);
      for (const r of routinesOf(g.id)) endRoutine(r);
      const ng = clone(g); ng.endedAt = today(); saveGroup(ng);
      closeSheet(); render();
      showUndo(`Grupo «${g.name}» eliminado`, () => { saveGroup(prevG); prevR.forEach(saveRoutine); });
      break;
    }
    case 'saveRoutine': {
      const d = UI.draft; d.name = (d.name||'').trim();
      if (!d.name){ const n = $('#ed-name'); n.focus(); n.placeholder = 'Ponle un nombre'; break; }
      if (!d.groupId || !S.groups[d.groupId]) d.groupId = groupList()[0]?.id || '';
      d.minutes = Math.min(600, Math.max(0, +d.minutes || 0)); d.timer = !!d.timer; d.time = d.time || '';
      if (d.freq.type === 'days' && !d.freq.days.length) d.freq.days = ALL_DAYS.slice();
      if (d.freq.type === 'week') d.freq = { type:'week', n: Math.min(7, Math.max(1, +d.freq.n || 1)) };
      saveRoutine(d); closeSheet(); render(); break;
    }
    case 'delRoutine': {
      if (!UI.confirmDel){ UI.confirmDel = true; renderSheet(); break; }
      const r = S.routines[UI.draft.id], prev = clone(r);
      if (RUN && RUN.key === r.id){ RUN = null; lsSet('rutinas-run', null); keepAwake(false); }
      endRoutine(r); closeSheet(); render();
      showUndo(`Rutina «${r.name}» eliminada`, () => saveRoutine(prev));
      break;
    }
    case 'saveTask': {
      const d = UI.draft, text = (d.text||'').trim();
      if (!text){ const n = $('#ed-name'); n.focus(); n.placeholder = 'Escribe la tarea'; break; }
      const task = { id: d.id, text, minutes: Math.min(600, Math.max(0, +d.minutes || 0)), time: d.time || '', timer: d.timer !== false, groupId: d.groupId || '', done: !!d.done, spentSec: d.spentSec || 0, doneAt: d.doneAt || null };
      if (d.carried) task.carried = true;
      if (d.order != null) task.order = d.order;
      const doc = dayDoc(UI.date); doc.tasks ||= []; doc.items ||= {};
      const i = doc.tasks.findIndex(t => t.id === d.id);
      if (i < 0) task.order = nextOrder(UI.date);
      if (i >= 0) doc.tasks[i] = task; else doc.tasks.push(task);
      saveDay(UI.date, doc); closeSheet(); render(); break;
    }
    case 'delTask': {
      if (!UI.confirmDel){ UI.confirmDel = true; renderSheet(); break; }
      const k = UI.draft._key, date = UI.date;
      if (RUN && RUN.key === k && RUN.date === date){ RUN = null; lsSet('rutinas-run', null); keepAwake(false); }
      const doc = dayDoc(date), idx = (doc.tasks||[]).findIndex(t => 't:'+t.id === k), removed = idx >= 0 ? doc.tasks[idx] : null;
      doc.tasks = (doc.tasks||[]).filter(t => 't:'+t.id !== k); saveDay(date, doc); closeSheet(); render();
      if (removed) showUndo(`Tarea «${removed.text}» borrada`, () => { const d2 = dayDoc(date); d2.tasks ||= []; d2.items ||= {}; d2.tasks.splice(Math.min(idx, d2.tasks.length), 0, removed); saveDay(date, d2); });
      break;
    }
    case 'saveNote': {
      const d = UI.draft, text = (d.text||'').trim();
      if (!text){ $('#ed-name').focus(); break; }
      const [kind, id] = (d.target || '').split(':');
      saveNote({ id: d.id, text, from: d.when === 'today' ? UI.date : addDays(UI.date, 1), groupId: kind === 'g' ? id : (kind === 'r' ? (S.routines[id]?.groupId || null) : null), rid: kind === 'r' ? id : null, createdAt: today() });
      closeSheet(); render(); break;
    }
    case 'toggleArchived': UI.showArchived = !UI.showArchived; render(); break;
    case 'restore': {
      const r = clone(S.routines[b.dataset.rid]); delete r.endedAt;
      const g = S.groups[r.groupId]; if (g && g.endedAt){ const ng = clone(g); delete ng.endedAt; saveGroup(ng); }
      saveRoutine(r); render(); break;
    }
    case 'range': UI.range = b.dataset.range; UI.offset = 0; render(); break;
    case 'prevPeriod': UI.offset--; render(); break;
    case 'nextPeriod': if (UI.offset < 0){ UI.offset++; render(); } break;
  }
}

/* ---------- arranque ---------- */
let lastDay = today(), lastMin = new Date().getMinutes();
setInterval(() => {
  const t = today(), m = new Date().getMinutes();
  if (t !== lastDay){ if (UI.date === lastDay) UI.date = t; lastDay = t; if (!UI.sheet && inApp()) render(); }
  else if (m !== lastMin && UI.tab === 'hoy' && !UI.sheet && !UI.editSpent && inApp()) render();
  lastMin = m;
}, 15000);

function resetData(){ S.groups = {}; S.routines = {}; S.notes = {}; S.days = {}; S.settings = { wake:'07:30', sleepHours:8 }; S.got = {}; S.err = ''; }
function stopListening(){ UNSUB.forEach(f => { try { f(); } catch {} }); UNSUB = []; }
function startLocal(){ resetData(); S.mode = 'local'; loadLocal(); render(); if (RUN) keepAwake(true); }
function startCloud(user){
  stopListening(); resetData();
  S.user = user; BASE = `users/${user.uid}/`; S.mode = 'loading';
  $('#view').innerHTML = '<p class="loading">Cargando tus rutinas…</p>';
  const need = ['g','r','n','d','s'];
  const done = () => { if (need.every(k => S.got[k])){ if (S.mode === 'loading') S.mode = 'cloud'; if (!UI.sheet) render(); } };
  const onErr = e => { S.mode = 'cloud'; S.err = e && e.code === 'permission-denied' ? 'Firebase no deja leer tus datos: revisa las reglas de Firestore (paso 3 de la guía).' : 'Se ha perdido la conexión con tus datos. Se reintentará sola.'; render(); };
  const col = (name, key) => UNSUB.push(FS.collection(BASE + name).onSnapshot(snap => {
    const m = {}; snap.docs.forEach(d => { m[d.id] = name === 'days' ? d.data() : { id: d.id, ...d.data() }; });
    S[key] = m; S.got[name[0]] = true; done();
  }, onErr));
  col('groups', 'groups'); col('routines', 'routines'); col('notes', 'notes'); col('days', 'days');
  UNSUB.push(FS.doc(BASE + 'config/settings').onSnapshot(snap => {
    if (snap.exists) S.settings = { wake:'07:30', sleepHours:8, ...snap.data() };
    S.got.s = true; done();
  }, onErr));
  if (RUN) keepAwake(true);
}

(async function boot(){
  // config.js puede traer el bloque tal cual lo da Firebase (const firebaseConfig = {...}) o window.FIREBASE_CONFIG
  let cfg = null;
  try { cfg = (typeof firebaseConfig !== 'undefined' && firebaseConfig) || window.firebaseConfig || window.FIREBASE_CONFIG || null; } catch { cfg = null; }
  const configured = cfg && cfg.apiKey && !String(cfg.apiKey).includes('PEGA');
  if (!configured || !window.firebase){
    if (lsGet('rutinas-try-local')) startLocal(); else { S.mode = 'setup'; render(); }
    return;
  }
  try {
    firebase.initializeApp(cfg);
    FS = firebase.firestore();
    try { await FS.enablePersistence({ synchronizeTabs: true }); } catch {}
    firebase.auth().onAuthStateChanged(u => {
      if (u) startCloud(u);
      else { stopListening(); resetData(); S.user = null; S.mode = 'login'; render(); }
    });
  } catch(e){
    S.mode = 'setup'; render();
    $('#view').insertAdjacentHTML('beforeend', `<div class="banner">No se pudo iniciar Firebase: ${esc(e.message || e)}. Revisa config.js.</div>`);
  }
})();

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
